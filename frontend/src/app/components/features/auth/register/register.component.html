<div class="container d-flex align-items-center justify-content-center min-vh-80 py-5">
    <div class="col-lg-8">
        <div class="glass-card p-5">
            <h2 class="text-center mb-4 font-weight-bold">Create Account</h2>

            <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="text-muted small text-uppercase font-weight-bold">First Name</label>
                        <input type="text" formControlName="firstName"
                            class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="text-muted small text-uppercase font-weight-bold">Last Name</label>
                        <input type="text" formControlName="lastName"
                            class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                    </div>
                </div>

                <div class="form-group">
                    <label class="text-muted small text-uppercase font-weight-bold">Username</label>
                    <input type="text" formControlName="username"
                        class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                </div>

                <div class="form-group">
                    <label class="text-muted small text-uppercase font-weight-bold">Email</label>
                    <input type="email" formControlName="email"
                        class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                </div>

                <div class="form-group">
                    <label class="text-muted small text-uppercase font-weight-bold">Date of Birth</label>
                    <input type="date" formControlName="dob"
                        class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="text-muted small text-uppercase font-weight-bold">Password</label>
                        <input type="password" formControlName="password"
                            class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="text-muted small text-uppercase font-weight-bold">Confirm Password</label>
                        <input type="password" formControlName="passwordRepeat"
                            class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                        <small class="text-danger"
                            *ngIf="registerForm.hasError('mismatch') && registerForm.get('passwordRepeat')?.touched">Passwords
                            do not match</small>
                    </div>
                </div>

                <button type="submit" [disabled]="registerForm.invalid || loading"
                    class="btn btn-premium btn-block mt-4">
                    {{ loading ? 'Creating Account...' : 'Register' }}
                </button>

                <div class="text-center mt-3">
                    <p class="text-muted small">Already a member? <a routerLink="/login"
                            class="text-primary font-weight-bold">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
