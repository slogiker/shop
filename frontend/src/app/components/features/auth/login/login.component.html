<div class="container d-flex align-items-center justify-content-center min-vh-80 py-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <h2 class="text-center mb-4 font-weight-bold">Welcome Back</h2>

            <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label class="text-muted small text-uppercase font-weight-bold">Username</label>
                    <input type="text" formControlName="username"
                        class="form-control bg-transparent text-white border-secondary rounded-pill px-3">
                </div>

                <div class="form-group">
                    <label class="text-muted small text-uppercase font-weight-bold">Password</label>
                    <div class="input-group">
                        <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                            class="form-control bg-transparent text-white border-secondary"
                            style="border-radius: 50px 0 0 50px; padding-left: 1rem;">
                        <div class="input-group-append">
                            <button type="button" class="btn btn-outline-secondary border-secondary"
                                style="border-radius: 0 50px 50px 0; background: transparent;"
                                (click)="showPassword = !showPassword">
                                <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" style="color: var(--text-secondary)"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" [disabled]="loginForm.invalid || loading" class="btn btn-premium btn-block mt-4">
                    {{ loading ? 'Signing In...' : 'Sign In' }}
                </button>

                <div class="text-center mt-3">
                    <p class="text-muted small">Don't have an account? <a routerLink="/register"
                            class="text-primary font-weight-bold">Register</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
